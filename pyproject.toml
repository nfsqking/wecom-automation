[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wecom-automation"
version = "0.1.0"
description = "Windows UI automation for WeCom"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "nfsqking"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "uiautomation>=2.0",
    "pefile>=2024.8.26",
    "pywin32>=300",
]

[project.urls]
Source = "https://github.com/nfsqking/wecom-automation"

[tool.setuptools.packages.find]
where = ["src"]
